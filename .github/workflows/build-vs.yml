name: build-vs

# Keep path filters in sync with build-linux.yml and build-macos.yml: each
# master build can recreate latest, so all platforms must run for the same changes.
on:
  push:
    paths-ignore:
      - '**/README.md'
  pull_request:
    paths-ignore:
      - '**/README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-vs2022:
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - platform: x64
            bits: 64
    env:
      BITS: ${{ matrix.bits }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: msys2/setup-msys2@v2.33.0
        with:
          update: true
          install: >-
            git
            unzip
            zip
            rsync
            wget
      - name: Recreate the latest release for this commit
        if: github.repository == 'openframeworks/projectGenerator' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ci_latest_release.sh
      - name: Determine Release
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "RELEASE=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "PRERELEASE=false" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "RELEASE=latest" >> $GITHUB_ENV
            echo "PRERELEASE=false" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/bleeding" ]]; then
            echo "RELEASE=bleeding" >> $GITHUB_ENV
            echo "PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "RELEASE=bleeding" >> $GITHUB_ENV
            echo "PRERELEASE=true" >> $GITHUB_ENV
          fi 
      - name: Install dependencies
        shell: bash
        run:
          ./scripts/vs/ci_install.sh
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build projectGenerator CMDLine with oF
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run:
          msbuild ../openFrameworks/apps/projectGenerator/commandLine/commandLine.vcxproj /p:configuration=release /p:platform=${{ matrix.platform }} /p:PlatformToolset=v143

      - name: Create projectGenerator cmd zip
        shell: msys2 {0}
        run:
          ../openFrameworks/apps/projectGenerator/scripts/vs/ci_cmd_package.sh

      - name: Test cmdline 
        shell: msys2 {0}
        run: 
          ../openFrameworks/apps/projectGenerator/scripts/vs/test_cmdline.sh

      - name: Test existing-project GUI settings and update arguments
        shell: pwsh
        run: node --test ../openFrameworks/apps/projectGenerator/scripts/test_gui_project_settings.cjs

      - name: Build emptyExample and allAddonsExample
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
        shell: bash
        run: ../openFrameworks/apps/projectGenerator/scripts/ci_build_examples.sh vs

      - name: Build and Package projectGenerator VS GUI
        shell: bash
        run: |
          cd ../openFrameworks/apps/projectGenerator/frontend
          npm install
          npm update
          npm run dist:win64
          cd dist
          pwd
          ls
      - name: Create projectGenerator VS GUI package
        shell: msys2 {0}
        run:
          ../openFrameworks/apps/projectGenerator/scripts/vs/ci_frontend_package.sh

      - name: Update Release CMD
        if: github.repository == 'openframeworks/projectGenerator' && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        uses: danoli3/action-gh-release@ec40b04e78c39008f73c4ca3fdf9b51df604c4ed # temporary patch: softprops/action-gh-release#852
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE }}
          make_latest: ${{ env.RELEASE == 'latest' && 'false' || 'legacy' }}
          files: ../openFrameworks/apps/projectGenerator/commandLine/bin/projectGenerator-vs.zip
      - name: Update Release GUI
        if: github.repository == 'openframeworks/projectGenerator' && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        uses: danoli3/action-gh-release@ec40b04e78c39008f73c4ca3fdf9b51df604c4ed # temporary patch: softprops/action-gh-release#852
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE }}
          make_latest: ${{ env.RELEASE == 'latest' && 'false' || 'legacy' }}
          files: ../openFrameworks/apps/projectGenerator/frontend/dist/projectGenerator-vs-gui.zip
